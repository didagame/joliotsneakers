<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>À la tête de Joliot Sneakers</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout : une « diapositive » par scène, comme dans un Genially ; réputation en points en haut à droite */
:root{
  --bg:#ECEEF2; --card:#FFFFFF; --ink:#1A1D2B; --muted:#535A6E; --line:#CDD2DC;
  --accent:#2944C9; --stamp:#C2412D; --good:#1E7A55; --bad:#C2412D; --soft:#E3E7F4;
  --f-display:"Bricolage Grotesque","Arial Black",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#11131C; --card:#1A1D2A; --ink:#E8EAF2; --muted:#A0A7BB; --line:#2E3345;
  --accent:#8EA2FF; --stamp:#F0846F; --good:#5CC79A; --bad:#F0846F; --soft:#232842; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11131C; --card:#1A1D2A; --ink:#E8EAF2; --muted:#A0A7BB; --line:#2E3345;
  --accent:#8EA2FF; --stamp:#F0846F; --good:#5CC79A; --bad:#F0846F; --soft:#232842; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
header{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px 20px}
.brand{font-family:var(--f-display);font-weight:800;font-size:1.15rem;letter-spacing:-.01em}
.brand span{font-family:var(--f-mono);font-size:.72rem;font-weight:500;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-left:8px}
.rep{display:flex;align-items:center;gap:8px;font-family:var(--f-mono);font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.dots{display:flex;gap:5px}
.dot{width:16px;height:16px;border-radius:50%;border:2px solid var(--accent);transition:background .3s}
.dot.on{background:var(--accent)}
.dot.pulse{animation:pop .5s ease}
main.slide{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:clamp(20px,4.5vw,44px);display:flex;flex-direction:column;gap:18px;min-height:min(70vh,560px);position:relative;min-width:0}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.kicker{font-family:var(--f-mono);font-size:.74rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}
.stamp{font-family:var(--f-mono);font-weight:500;font-size:.78rem;text-transform:uppercase;letter-spacing:.1em;color:var(--stamp);border:2px solid var(--stamp);border-radius:4px;padding:4px 10px;transform:rotate(-3deg);white-space:nowrap;animation:stampin .5s .6s cubic-bezier(.3,1.6,.5,1) both}
@keyframes stampin{from{opacity:0;transform:rotate(-14deg) scale(2.2)}}
h1{font-family:var(--f-display);font-weight:800;font-size:clamp(2.1rem,7vw,3.4rem);line-height:1.02;letter-spacing:-.02em;margin:0;text-wrap:balance}
h2{font-family:var(--f-display);font-weight:800;font-size:1.45rem;line-height:1.15;margin:0;text-wrap:balance}
.text p{margin:0 0 .8em;max-width:65ch}
.text p:last-child{margin-bottom:0}
.delta{align-self:flex-start;font-family:var(--f-mono);font-size:.82rem;padding:4px 10px;border-radius:999px;border:1.5px solid currentColor}
.delta.up{color:var(--good)} .delta.down{color:var(--bad)}
.ask{font-family:var(--f-display);font-weight:800;font-size:1.3rem;margin-top:4px}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:10px}
button.opt{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;gap:4px;padding:14px 16px;border:2px solid var(--ink);border-radius:8px;background:var(--card);transition:transform .12s,background .15s,color .15s;min-width:0}
button.opt b{font-family:var(--f-display);font-size:1.08rem;line-height:1.2}
button.opt span{font-size:.9rem;color:var(--muted)}
button.opt:hover,button.opt:focus-visible{background:var(--ink);color:var(--card);transform:translateY(-2px)}
button.opt:hover span,button.opt:focus-visible span{color:var(--card)}
button.opt:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button.opt.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 14%,var(--card));color:var(--ink);transform:none}
button.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,var(--card));color:var(--ink);transform:none}
button.opt[disabled]{cursor:default}
button.opt[disabled] span{color:var(--muted)}
.feedback{border-left:4px solid var(--good);padding:2px 0 2px 12px;max-width:65ch}
.feedback.no{border-color:var(--bad)}
button.go{all:unset;box-sizing:border-box;cursor:pointer;align-self:flex-start;font-family:var(--f-display);font-weight:800;font-size:1.1rem;padding:11px 24px;background:var(--accent);color:var(--card);border-radius:999px;margin-top:auto}
button.go:hover{filter:brightness(1.08)}
button.go:focus-visible{outline:3px solid var(--stamp);outline-offset:3px}
.quote{font-size:1.12rem;font-style:italic;border-left:4px solid var(--stamp);padding-left:14px;max-width:60ch}
.quote cite{display:block;font-style:normal;font-family:var(--f-mono);font-size:.78rem;color:var(--muted);margin-top:6px}
.recap{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:10px}
.recap div{border:1.5px solid var(--line);border-radius:8px;padding:12px 14px;font-size:.92rem;min-width:0}
.recap b{display:block;font-family:var(--f-display);font-size:1.05rem;color:var(--stamp)}
.recap em{display:block;font-style:normal;color:var(--muted);font-size:.85rem;margin-top:5px}
.cmp{border-left:4px solid #7A4E9A;padding:6px 0 6px 12px;background:color-mix(in srgb,#7A4E9A 8%,transparent);margin-top:10px!important}
.score{font-family:var(--f-display);font-weight:800;font-size:3.6rem;line-height:1}
footer{font-size:.82rem;color:var(--muted);display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px}
footer button{all:unset;cursor:pointer;text-decoration:underline}
footer button:focus-visible{outline:2px solid var(--accent)}
.stage{perspective:1100px;perspective-origin:50% 40%}
.ill,.photo{margin:0;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:var(--soft);position:relative;
  transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transform-style:preserve-3d;transition:transform .25s ease-out,box-shadow .25s;
  box-shadow:calc(var(--ry,0deg)/1deg*-1.6px) calc(10px + var(--rx,0deg)/1deg*1.6px) 28px -14px rgba(20,24,40,.45);
  animation:in3d .8s cubic-bezier(.2,.7,.2,1) both}
.ill::after,.photo::after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:inherit;
  background:radial-gradient(circle at var(--gx,50%) var(--gy,30%),rgba(255,255,255,.28),rgba(255,255,255,0) 55%);opacity:var(--go,0);transition:opacity .3s}
.ill svg{display:block;width:100%;height:auto;overflow:hidden}
.ill .pop{transform-box:fill-box;transform-origin:50% 100%;
  transform:translate(calc(var(--px,0)*var(--d,0)*1px),calc(var(--py,0)*var(--d,0)*1px));transition:transform .3s ease-out;
  animation:popin .6s cubic-bezier(.3,1.5,.5,1) both}
.ill .pop.bg{animation-name:fadein;transform:none}
.photo .pic{overflow:hidden;position:relative}
.photo img{display:block;width:100%;aspect-ratio:16/8;object-fit:cover;max-width:100%;
  transform:translate(calc(var(--px,0)*-.6px),calc(var(--py,0)*-.6px)) scale(1.06);transition:transform .3s ease-out;animation:kb 16s ease-in-out .8s infinite alternate}
.photo figcaption{animation:capin .6s .5s ease-out both}
@keyframes in3d{from{opacity:0;transform:rotateX(16deg) rotateY(-8deg) translateY(26px) scale(.94)}to{opacity:1}}
@keyframes popin{from{opacity:0;transform:translateY(34px) scale(.6)}60%{opacity:1}}
@keyframes fadein{from{opacity:0}}
@keyframes kb{from{scale:1}to{scale:1.1;translate:-2% -1.5%}}
@keyframes capin{from{opacity:0;transform:translateY(12px)}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
@keyframes sway{0%,100%{transform:rotateX(2deg) rotateY(-4deg)}50%{transform:rotateX(-1deg) rotateY(4deg)}}
@media (hover:none){.ill,.photo{animation:in3d .8s cubic-bezier(.2,.7,.2,1) both,sway 7s ease-in-out .8s infinite}}
.rise{animation:rise .5s ease-out both}
.photo figcaption{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 12px;padding:7px 12px;font-size:.84rem;background:var(--card)}
.photo figcaption small{font-size:.72rem;color:var(--muted)}
.photo figcaption small a{color:var(--muted)}
.res{display:flex;flex-direction:column;gap:8px}
.res-h{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.res-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:8px}
a.rc{display:flex;flex-direction:column;gap:3px;padding:10px 12px;border:1.5px solid var(--line);border-left:4px solid var(--accent);border-radius:6px;text-decoration:none;color:var(--ink);background:var(--card);min-width:0}
a.rc:hover{border-color:var(--accent);background:var(--soft)}
a.rc:focus-visible{outline:3px solid var(--stamp);outline-offset:2px}
a.rc .rt{font-family:var(--f-mono);font-size:.68rem;text-transform:uppercase;letter-spacing:.08em;color:var(--accent)}
a.rc b{font-size:.93rem;line-height:1.3}
a.rc small{font-size:.78rem;color:var(--muted)}
details.allres{border:1px dashed var(--line);border-radius:6px;padding:10px 14px}
details.allres summary{cursor:pointer;font-weight:700}
details.allres li{margin:4px 0;font-size:.9rem}
details.allres a{color:var(--accent)}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.35)}100%{transform:scale(1)}}
@keyframes enter{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}
main.slide.in{animation:enter .3s ease}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="wrap">
  <header>
    <div class="brand">À la tête de Joliot Sneakers<span>Les acteurs de la mondialisation</span></div>
    <div class="rep">Réputation <div class="dots" id="dots"></div></div>
  </header>
  <main class="slide" id="slide" aria-live="polite"></main>
  <footer>
    <span>Fiction pédagogique : l'entreprise et les personnages sont inventés, les pays et les acteurs sont réels.</span>
    <button type="button" id="restart">Recommencer</button>
  </footer>
</div>

<script>
(function(){
const MAX=5;
const fresh=()=>({scene:"choix",rep:3,flags:{},delta:0,evalI:0,score:0,used:[],evalQ:null,sq:null});
let S=fresh();
const W="https://fr.wikipedia.org/wiki/";

const NOM=()=>S.flags.f?"Ombeline":"Gontran";
const E=()=>S.flags.f?"e":"";
const SC={
choix:{kicker:"Avant de commencer",title:"Qui allez-vous incarner ?",
 text:[`Vous allez diriger une grande entreprise pendant un an. Choisissez votre personnage : vos décisions seront les mêmes, mais le monde qui vous entoure ne réagira peut-être pas de la même façon.`],
 choices:[
  {b:"Ombeline",d:"46 ans, ingénieure, 20 ans d'expérience dans l'industrie de la chaussure.",go:"intro",set:{f:true}},
  {b:"Gontran",d:"46 ans, ingénieur, 20 ans d'expérience dans l'industrie de la chaussure.",go:"intro",set:{f:false}}]},
plafond:{kicker:"Le premier conseil d'administration",title:"Le plafond de verre",delta:-1,
 text:[`Dès votre première réunion, l'ambiance est tendue. Un administrateur demande devant tout le monde si vous saurez « tenir tête aux usines asiatiques ». Un autre s'adresse à votre directeur financier plutôt qu'à vous. On vous a choisie, mais on ne vous fait pas confiance : <b>le conseil vous retire un point de réputation</b>, avant même votre premier choix.`,
 `C'est du <b>sexisme</b> : juger, traiter différemment ou dévaloriser une personne à cause de son sexe. Ici, il prend la forme de <b>stéréotypes</b> (« une femme serait moins dure en affaires ») et d'un entre-soi masculin dans les instances de direction.`,
 `Dans la réalité, la loi <b>Copé-Zimmermann</b> (2011) impose au moins 40 % de femmes dans les conseils d'administration des grandes entreprises : début 2025, ils en comptaient environ 46 % dans le CAC 40. Mais au sommet, le <b>plafond de verre</b> résiste : aucune femme PDG et seulement quatre directrices générales parmi les 40 plus grandes entreprises françaises.`],
 next:"pres"},
intro:{kicker:"Votre nouvelle vie",title:"Bravo !",
 text:[s=>`${NOM()}, vous venez, après une belle carrière, d'accéder au poste de <b>${s.flags.f?"présidente-directrice générale":"président-directeur général"} (PDG)</b> d'une grande entreprise implantée dans de nombreux pays : <b>Joliot Sneakers</b>.`,
 s=>`Le conseil d'administration, composé des principaux actionnaires (les propriétaires), vous a choisi${E()} après de longues hésitations. Votre contrat est temporaire. Vous commencez avec 3 points de réputation : si vous tombez à zéro, vous êtes licencié${E()}.`],
 btn:"Débuter",next:s=>s.flags.f?"plafond":"pres"},
pres:{kicker:"Votre entreprise",title:"Joliot Sneakers",
 text:[`Nous fabriquons des baskets haut de gamme, vendues dans 40 pays. Notre siège est à Paris, nos boutiques sont à New York, Tokyo, Séoul et Dubaï, et notre usine est installée près de Porto, au <b>Portugal</b>.`,
 `Nos clients sont des sportifs, des artistes et des collectionneurs qui attendent des modèles uniques. Mais la concurrence est rude.`],
 next:"deloc"},

deloc:{kicker:"Les ennuis commencent…",title:"Délocaliser ?",
 text:[`Le conseil d'administration vous demande de réfléchir à une situation économique compliquée. Les marques concurrentes produisent en Asie pour beaucoup moins cher, et les clients veulent payer moins.`,
 `Les actionnaires veulent fermer l'usine portugaise et délocaliser la production dans un pays où les salaires sont plus bas.`],
 ask:"Quelle réponse leur apportez-vous ?",
 choices:[
  {b:"Au Vietnam",d:"Deuxième exportateur mondial de chaussures, des ouvriers formés et de grands ports.",go:"vietnam",d2:1},
  {b:"En Birmanie",d:"Les salaires y sont parmi les plus bas d'Asie !",go:"birmanie",d2:-1},
  {b:"En Éthiopie",d:"L'État a construit des parcs industriels neufs et offre des exonérations d'impôts.",go:"ethiopie",d2:-1},
  {b:"Pas question de délocaliser",d:"Le « made in Europe » fait partie de notre image. On reste au Portugal.",go:"rien",d2:-1}]},
rien:{kicker:"Réunion d'urgence",title:"Rien ?",
 text:[`Le conseil d'administration est mécontent de votre refus. Les ventes baissent et les actionnaires exigent une décision. Une nouvelle réunion a lieu !`],
 next:"deloc"},
birmanie:{kicker:"Rangoun",title:"Birmanie",
 text:[`Votre usine vient d'ouvrir quand l'armée prend le pouvoir par un coup d'État. Les manifestations sont réprimées, internet est coupé, l'Union européenne décide des sanctions.`,
 `Plusieurs grandes marques de vêtements quittent le pays. Les ONG publient la liste des entreprises qui restent : Joliot Sneakers y figure. Le conseil d'administration est furieux. Il faut choisir un autre pays.`],
 next:"deloc"},
ethiopie:{kicker:"Hawassa",title:"Éthiopie",
 text:[`L'État éthiopien vous accueille avec des avantages fiscaux. Mais une guerre civile éclate dans le nord du pays. Les États-Unis retirent à l'Éthiopie ses avantages commerciaux : vos baskets y seront taxées.`,
 `Les routes vers le port de Djibouti sont peu sûres et l'électricité est coupée plusieurs heures par jour. Vous perdez un point. Il faut choisir un autre lieu de délocalisation.`],
 next:"deloc"},
vietnam:{kicker:"Hô Chi Minh-Ville",title:"Vietnam",
 text:[`Votre nouvelle implantation se déroule bien. Vous avez fermé votre usine portugaise et ouvert dans une zone industrielle près d'Hô Chi Minh-Ville. L'État vietnamien attire les FMN : impôts réduits, routes et ports modernes.`,
 `Très bon choix d'après vos administrateurs ! Vous gagnez un point. Bien sûr, il y a un léger malaise : 400 ouvriers ont perdu leur emploi au Portugal, et au Vietnam les ouvriers font beaucoup d'heures supplémentaires pour un salaire faible…`],
 next:"mafia"},

mafia:{kicker:"Un matin",title:"Une drôle de visite",
 text:[`Votre journée commence bien ! Votre assistante vous annonce que le premier rendez-vous est arrivé. Il s'agit d'un Napolitain, <b>Salvatore Esposito</b>. Très bien habillé, il s'installe en face de vous et commence une conversation assez bizarre.`,
 `Vous comprenez rapidement qu'il appartient à la <b>Camorra</b>, la mafia de Naples. Il a une solution pour en finir avec la plaie de la <b>contrefaçon</b> : des copies de vos baskets sont vendues partout sur internet et sur les marchés. Il vous demande de virer une grosse somme sur un compte dans un <b>paradis fiscal</b> pour que lui et ses « amis » arrêtent les fabricants de fausses baskets. Si vous refusez, cela pourrait causer de sérieux dommages à votre entreprise.`],
 ask:"Que décidez-vous de faire ?",
 choices:[
  {b:"Accord discret",d:"Vous acceptez et faites les virements discrètement, sans en parler à personne.",go:"merci",d2:1,set:{mafia:true}},
  {b:"Appeler la police",d:"Vous refusez et prévenez la police judiciaire.",go:"police",d2:1},
  {b:"Prévenir le CA",d:"Vous annoncez au conseil d'administration votre accord avec la mafia : l'efficacité avant tout !",go:"ca_mafia"}]},
ca_mafia:{special:"fired",why:s=>`Votre conduite est inacceptable et met en danger l'avenir de Joliot Sneakers. Vous êtes licencié${E()} pour faute grave.`},
merci:{kicker:"Quelques semaines plus tard",title:"Merci Salvatore",
 text:[`Grâce à votre accord, les contrefaçons sont beaucoup moins nombreuses sur internet et sur les marchés. Le conseil d'administration pense que c'est le résultat de votre bonne gestion : vous gagnez un point.`,
 `Salvatore vous propose aussi de « s'occuper » de vos concurrents. C'est tentant, mais trop cher. Vous refusez…`],
 next:"journa"},
police:{kicker:"Quelques semaines plus tard",title:"Coup de filet à Naples",
 text:[`La police française travaille avec la police italienne. Salvatore et ses amis sont arrêtés : ils dirigeaient eux-mêmes des ateliers de fausses baskets ! Votre conduite est exemplaire : vous gagnez un point.`],
 next:"journa"},
journa:{kicker:"Le lendemain",title:"Une journaliste",
 text:[`Votre assistante vous apporte un café comme vous l'aimez et vous annonce un rendez-vous téléphonique. Surprise : c'est une journaliste d'un grand quotidien. Aïe ! Ce journal a déjà enquêté sur des entreprises, et cela a parfois débouché sur des scandales, comme l'affaire des <b>Panama Papers</b>.`,
 `Elle voudrait faire une interview sur la contrefaçon et sur la manière dont vous avez réglé ce problème si vite.`,
 s=>s.flags.f?`Elle prévient aussi qu'elle vous demandera « comment vous conciliez vie de famille et direction d'une multinationale ». Une question qu'elle n'a posée à aucun de vos concurrents masculins.`:""],
 ask:"Acceptez-vous l'interview ?",
 choices:[
  {b:"Oui",d:"Vous acceptez l'interview qui vous est proposée.",go:"interview"},
  {b:"Non",d:s=>s.flags.mafia?"Vous refusez et prévenez Salvatore pour qu'il « règle le problème ».":"Vous refusez poliment : pas de commentaire.",go:"refus"}]},
refus:{route:s=>s.flags.mafia?"horreur":"refus_ok"},
refus_ok:{kicker:"Quelques jours plus tard",title:"Pas de commentaire",
 text:[`L'article paraît sans votre interview. Il parle surtout du travail des polices française et italienne. Rien de grave.`],
 next:"omc"},
horreur:{kicker:"Une semaine plus tard",title:"Horreur",
 text:[s=>`Vous apprenez par la presse que la journaliste a été agressée devant chez elle et que ses ordinateurs ont été volés. La Camorra a « réglé le problème ».`,
 s=>`La France et l'Italie lancent une enquête. Les policiers découvrent que la journaliste devait vous interviewer, puis remontent jusqu'à vos virements vers le paradis fiscal. Vous êtes mis${E()} en examen et placé${E()} en détention provisoire.`],
 next:"prison"},
prison:{special:"fired",why:s=>`Complicité avec une organisation mafieuse. Vous êtes démis${E()} de vos fonctions en attendant votre procès.`},
interview:{kicker:"L'après-midi",title:"Parler à la presse qui vous presse",
 text:[`L'interview a lieu dans votre magnifique appartement parisien, pour donner un côté chaleureux. Vous expliquez que vous avez embauché des avocats pour attaquer les contrefacteurs. Elle vous croit, mais…`,
 `… à la fin de l'interview, sans même vous en rendre compte, vous dites que Joliot Sneakers ne paie presque pas d'impôts en France, grâce à une filiale installée dans un paradis fiscal. Ce scoop est repris par toute la presse. Le conseil d'administration vous critique fortement : vous perdez un point.`],
 delta:-1,next:"omc"},

omc:{kicker:"Six mois plus tard",title:"Guerre commerciale",
 text:[`Mauvaise nouvelle : les États-Unis, votre premier marché, augmentent brutalement leurs <b>droits de douane</b> sur les chaussures importées. Une paire de Joliot Sneakers coûte maintenant 40 dollars de plus à New York.`,
 `Votre directeur juridique vous parle de l'<b>OMC</b>, l'Organisation mondiale du commerce, qui règle les conflits commerciaux.`],
 ask:"Que faites-vous ?",
 choices:[

const FAMS=["fmn","etat","mafia","oi","ong","medias","genre"];
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function prepQ(q){const o=shuffle(q.opts.map((t,i)=>({t,i})));return {id:q.id,q:q.q,exp:q.exp,opts:o.map(x=>x.t),ok:o.findIndex(x=>x.i===q.ok)}}
function drawSceneQuiz(){const used=S.used||[];const c=shuffle(POOL.filter(q=>q.g&&!used.includes(q.id)));const q=c[0]||POOL.find(q=>q.g);S.used=used.concat(q.id);return prepQ(q)}
function drawEval(){
  const used=S.used||[];const left=POOL.filter(q=>!used.includes(q.id));
  const pick=[];FAMS.forEach(f=>{const c=shuffle(left.filter(q=>q.t===f));if(c[0])pick.push(c[0])});
  shuffle(left.filter(q=>!pick.includes(q))).slice(0,8-pick.length).forEach(q=>pick.push(q));
  return shuffle(pick).map(prepQ);
}

  if(!mineOnly&&typeof S.alt==="number"&&!S.altFired){S.alt=Math.max(0,Math.min(MAX,S.alt+n));if(S.alt===0)S.altFired=true}}
function go(id){
  let sc=SC[id];
  while(sc&&sc.route){id=sc.route(S);sc=SC[id]}
  if(sc.delta)change(sc.delta,id==="plafond");
  if(S.rep<=0&&!sc.special){id="fired_rep"}
  S.scene=id;save();render();
  const t=$("slide").getBoundingClientRect().top;if(t<0)window.scrollTo({top:window.scrollY+t-16});
}
SC.fired_rep={special:"fired",why:"Votre gestion a fait perdre toute sa réputation à Joliot Sneakers. Le conseil d'administration vote votre départ."};
function head(sc){
  return `<div class="top"><span class="kicker">${sc.kicker||""}</span></div><h1>${sc.title}</h1>`+media(S.scene);
}
function media(id){
  const ph=typeof PHOTOS!=="undefined"&&PHOTOS[id];
  if(ph)return `<div class="stage"><figure class="photo"><div class="pic"><img src="${ph.src}" alt="${ph.cap}" style="${ph.fit?`object-fit:${ph.fit};background:#fff;`:""}${ph.pos?`object-position:${ph.pos};`:""}"></div><figcaption><span>${ph.cap}</span><small>Photo : ${ph.aut}, <a href="https://commons.wikimedia.org/wiki/${ph.file}?uselang=fr" target="_blank" rel="noopener">Wikimedia Commons</a>, ${ph.lic}</small></figcaption></figure></div>`;
  const il=illHtml(id);return il?`<div class="stage">${il}</div>`:"";
}
function deltaHtml(d){return d?`<span class="delta ${d>0?"up":"down"}">${d>0?"+":"−"}${Math.abs(d)} point${Math.abs(d)>1?"s":""} de réputation</span>`:""}
function quizBlock(m,qz,onDone,reward){
  const box=document.createElement("div");box.style.cssText="display:flex;flex-direction:column;gap:12px";
  box.innerHTML=`<h2>${qz.q}</h2><div class="choices">${qz.opts.map((o,i)=>`<button type="button" class="opt" data-i="${i}"><b>${o}</b></button>`).join("")}</div><div class="fbk"></div>`;
  m.appendChild(box);
  box.querySelectorAll("button.opt").forEach(b=>b.onclick=()=>{
    const i=+b.dataset.i,ok=i===qz.ok;
    box.querySelectorAll("button.opt").forEach((x,j)=>{x.disabled=true;if(j===qz.ok)x.classList.add("right");else if(j===i)x.classList.add("wrong")});
    box.querySelector(".fbk").innerHTML=`<div class="feedback ${ok?"":"no"}"><p style="margin:0"><b>${ok?"Bonne réponse !":"Raté."}</b> ${qz.exp}</p></div>`;
    onDone(ok);
  });
}
let render;render=function(){
  const sc=SC[S.scene],m=$("slide"),d=S.delta;S.delta=0;
  dots(d);m.classList.remove("in");void m.offsetWidth;m.classList.add("in");
  if(sc.special)return special(sc,m,d);
  let h=head(sc)+deltaHtml(d)+`<div class="text">${sc.text.map(val).filter(Boolean).map(p=>`<p>${p}</p>`).join("")}</div>`;
  h+=resHtml(S.scene);
  if(sc.choices){
    h+=(sc.ask?`<div class="ask">${sc.ask}</div>`:"")+`<div class="choices">${sc.choices.map((c,i)=>`<button type="button" class="opt" data-i="${i}"><b>${c.b}</b><span>${val(c.d)}</span></button>`).join("")}</div>`;
    m.innerHTML=h;
    m.querySelectorAll("button.opt").forEach(b=>b.onclick=()=>{const c=sc.choices[+b.dataset.i];if(c.set){Object.assign(S.flags,c.set);if("f" in c.set){S.alt=c.set.f?3:2;S.altFired=false}}change(c.d2||0);go(c.go)});
    return;
  }
  m.innerHTML=h;
  const btn=()=>{const b=document.createElement("button");b.type="button";b.className="go";b.textContent=sc.btn||"Continuer";b.onclick=()=>go(val(sc.next));m.appendChild(b);return b};
  if(sc.quiz){if(!S.sq||S.sq.scene!==S.scene){S.sq={scene:S.scene,q:drawSceneQuiz()};save()}quizBlock(m,S.sq.q,()=>btn().focus())}else btn();
}
function special(sc,m,d){
  if(sc.special==="fired"){
    m.innerHTML=`<div class="top"><span class="kicker">Fin de partie</span><span class="stamp">Licencié${E()}</span></div><h1>La porte de sortie</h1>${media(S.scene)}${deltaHtml(d)}
    <div class="quote">« ${val(sc.why)} »<cite>Irène, actionnaire majoritaire</cite></div>
    <div class="text"><p>Relisez vos choix : une FMN doit composer avec les États, les organisations internationales, les ONG et les médias, et ne jamais pactiser avec les mafias.</p>${S.scene==="fired_rep"&&S.flags.f&&S.alt>0?`<p><b>Avec Gontran, vous auriez encore un point et vous seriez toujours en poste</b> : le conseil vous a retiré un point au début de la partie, uniquement parce que vous êtes une femme.</p>`:""}</div>`;
    const b=document.createElement("button");b.type="button";b.className="go";b.textContent="Retenter ma chance";b.onclick=restart;m.appendChild(b);return;
  }
  if(sc.special==="bilan"){
    const ok=S.rep>=3;
    m.innerHTML=`<div class="top"><span class="kicker">Fin de votre première année</span></div><h1>Bilan</h1>${media("bilan")}${deltaHtml(d)}
    <div class="quote">« ${ok?"Vous avez survécu à votre première année. Le conseil d'administration vous renouvelle sa confiance.":"Vous avez survécu de justesse. Le conseil d'administration vous a à l'œil."}${S.flags.wash?" Mais attention : l'image verte de la marque ne repose sur rien de concret.":""} »<cite>Irène, actionnaire majoritaire</cite></div>
    <div class="text"><p>Vous terminez l'année avec <b>${S.rep} point${S.rep>1?"s":""} de réputation sur ${MAX}</b>. Voyons ce que vous avez retenu sur les acteurs de la mondialisation.</p>${compare()}</div>`;
    const b=document.createElement("button");b.type="button";b.className="go";b.textContent="Évaluation";b.onclick=()=>{S.evalI=0;S.score=0;S.evalQ=drawEval();go("eval")};m.appendChild(b);return;
  }
  if(sc.special==="eval"){
    if(!S.evalQ)S.evalQ=drawEval();
    const EV=S.evalQ,it=EV[S.evalI],last=S.evalI===EV.length-1;
    m.innerHTML=`<div class="top"><span class="kicker">Évaluation · question ${S.evalI+1} sur ${EV.length}</span></div>`+(S.evalI===0?media("eval"):"");
    quizBlock(m,it,ok=>{if(ok)S.score++;save();const b=document.createElement("button");b.type="button";b.className="go";b.textContent=last?"Voir mon résultat":"Question suivante";b.onclick=()=>{if(last)go("fin");else{S.evalI++;go("eval")}};m.appendChild(b);b.focus()});
    return;
  }
  if(sc.special==="fin"){
    const n=S.score,t=(S.evalQ||[]).length||8;
    m.innerHTML=`<div class="top"><span class="kicker">Résultat</span></div>${media("fin")}<div class="score">${n}/${t}</div>
    <p style="margin:0;color:var(--muted)">${n>=7?"Excellent : vous connaissez les acteurs de la mondialisation.":n>=5?"Pas mal : relisez le tableau ci-dessous.":"À retravailler : relisez le tableau et rejouez une partie."} Rejouez : les questions changent à chaque partie.</p>
    ${compare()}<p style="margin:0;color:var(--muted)">En classe : comparez les résultats des Ombeline et des Gontran.</p>
    <h2>Les acteurs de la mondialisation</h2>
    ${resHtml("fin")}
    <div class="recap">${RECAP.map(([a,b,c])=>`<div><b>${a}</b>${b}<em>Dans le jeu : ${c}</em></div>`).join("")}</div>`;
    const all=[];const seen=new Set();Object.keys(RES).forEach(k=>RES[k].forEach(r=>{if(!seen.has(r[1])){seen.add(r[1]);all.push(r)}}));
    m.insertAdjacentHTML("beforeend",`<details class="allres"><summary>Toutes les ressources du jeu (${all.length})</summary><ul>${all.map(([t,u,ty,src,en])=>`<li><a href="${u}" target="_blank" rel="noopener">${t}</a> · ${ty}, ${src}</li>`).join("")}</ul></details>`);
    const b=document.createElement("button");b.type="button";b.className="go";b.textContent="Rejouer avec d'autres choix";b.onclick=restart;m.appendChild(b);
  }
}
function compare(){
  const a=S.alt,r=S.rep;if(typeof a!=="number")return"";
  if(S.flags.f){
    const t=a>r?`Avec exactement les mêmes choix, il aurait terminé avec ${a} points au lieu de ${r}.`:`Avec les mêmes choix, il aurait terminé avec le même score : vos bonnes décisions ont rattrapé le point retiré au départ, mais vous êtes partie avec un handicap qu'il n'avait pas.`;
    return `<p class="cmp"><b>Et si vous aviez joué Gontran ?</b> ${t} Le seul écart entre vous : le point retiré par le conseil d'administration au début, uniquement parce que vous êtes une femme.</p>`}
  const t=S.altFired?`Avec exactement les mêmes choix, elle aurait été licenciée en cours de partie.`:a<r?`Avec exactement les mêmes choix, elle aurait terminé avec ${a} point${a>1?"s":""} au lieu de ${r}.`:`Avec les mêmes choix, elle aurait fini avec le même score, mais en devant d'abord rattraper un point de retard.`;
  return `<p class="cmp"><b>Et si vous aviez joué Ombeline ?</b> ${t} Le conseil d'administration lui retire un point dès le départ, uniquement parce qu'elle est une femme.</p>`;
}
/* ---------- Animations : apparition, profondeur, inclinaison 3D ---------- */
const NS="http://www.w3.org/2000/svg";
const calm=()=>matchMedia("(prefers-reduced-motion: reduce)").matches;
function fx(m){
  const fig=m.querySelector("figure.ill,figure.photo");
  let t=0;
  if(fig){
    const svg=fig.querySelector("svg");
    if(svg){
      const kids=[...svg.children].filter(c=>c.tagName!=="defs");const n=kids.length;
      kids.forEach((c,i)=>{
        const g=document.createElementNS(NS,"g");g.setAttribute("class","pop");
        let wide=false;try{const b=c.getBBox();wide=b.width>=700||i===0}catch(e){}
        if(wide)g.classList.add("bg");
        g.style.setProperty("--d",wide?0:(.35+.65*i/Math.max(1,n-1)).toFixed(2));
        g.style.animationDelay=(wide?0:Math.round(150+900*i/Math.max(1,n-1)))+"ms";
        svg.insertBefore(g,c);g.appendChild(c);
      });
      t=1050;
    }else t=700;
    const set=(rx,ry,px,py,gx,gy,go)=>{fig.style.setProperty("--rx",rx+"deg");fig.style.setProperty("--ry",ry+"deg");
      const tgt=svg||fig;tgt.style.setProperty("--px",px);tgt.style.setProperty("--py",py);
      fig.style.setProperty("--gx",gx+"%");fig.style.setProperty("--gy",gy+"%");fig.style.setProperty("--go",go)};
    fig.addEventListener("pointermove",e=>{if(calm()||e.pointerType==="touch")return;const r=fig.getBoundingClientRect();
      const x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;
      set((-y*9).toFixed(2),(x*12).toFixed(2),(-x*26).toFixed(1),(-y*16).toFixed(1),((x+.5)*100).toFixed(0),((y+.5)*100).toFixed(0),1)});
    fig.addEventListener("pointerleave",()=>set(0,0,0,0,50,30,0));
  }
  [...m.querySelectorAll(":scope > .text p, :scope > .delta, :scope > .ask, :scope > .choices > button, :scope > .res, :scope > .quote")].forEach((el,i)=>{
    el.classList.add("rise");el.style.animationDelay=(Math.min(t,900)*.5+i*90)+"ms"});
}
const _render=render;render=function(){_render();fx($("slide"))};
function restart(){S=fresh();save();render();window.scrollTo({top:0})}
$("restart").onclick=restart;
function start(data){if(data&&data.S&&SC[data.S.scene])S=data.S;else{const l=load();if(l)S=l}S.delta=0;render()}
window.claude?.hot?.snapshot?.(()=>({S}));
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
})();
</script>
